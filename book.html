<!-- Flip-book adapted from "creative_coding-flip_book" by Fabien CHAVONET (github.com/fchavonet) -->
<!DOCTYPE html>
<html lang="ne">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>किताब – प्रतीक अध्यात्म सञ्जाल (Pratik Adhyatma Sanjal)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5c2f26">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Akshar:wght@400;500;600;700&family=Khand:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="flipbook/flipbook.css">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- DAISYUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- SCRIPT -->
    <script src="flipbook/flipbook.js" defer></script>

    <style>
        #backHomeBtn {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.9);
            color: #5c2f26;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }
        #bookScaleWrap {
            transform-origin: center center;
            transition: transform .6s ease;
        }
    </style>
</head>

<body>
    <a href="index.html" id="backHomeBtn">← प्रतीक अध्यात्म सञ्जाल</a>

    <main>
        <!-- TOP CONTAINER -->
        <div class="fixed top-0 left-0 w-full h-auto p-4 flex flex-row justify-end items-center">
            <!-- Toggle mode button -->
            <label class="swap swap-rotate">
                <input type="checkbox" class="theme-controller" value="black" />
                <i class="bi bi-sun-fill swap-on"></i>
                <i class="bi bi-moon-stars-fill swap-off"></i>
            </label>
        </div>

        <!-- FLIP BOOK (मोबाइलमा फिट हुनका लागि scale गरिन्छ; पाना data/book.json बाट स्वतः बन्छन्) -->
        <div id="bookScaleWrap">
            <div id="flipBookContainer"><!-- JS ले यहाँ भर्छ --></div>
        </div>

        <!-- RESPONSIVE WARNING -->
        <dialog id="responsive-warning" class="modal backdrop-blur-xl">
            <div class="modal-box max-w-xs flex flex-col justify-center items-center gap-4 text-center rounded-xl bg-base-300">
                <i class="bi bi-aspect-ratio text-4xl"></i>

                <p class="text-lg font-semibold -mt-2">
                    This web application is designed for larger screens.
                </p>

                <p class="text-xs">
                    A mobile-friendly version is coming soon...
                </p>
            </div>
        </dialog>
    </main>

    <!-- किताबका पाना data/book.json बाट बनाउने: जति चाहिन्छ त्यति (auto-pagination) -->
    <script>
        (function () {
            var PAGE_TARGET_HEIGHT = 398; // .book-page-text को उचाइसँग मिल्दो
            var container = document.getElementById('flipBookContainer');
            if (!container) return;

            function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

            function toBlocks(raw) {
                return String(raw || '').split(/\n\s*\n/).map(function (b) {
                    var t = b.trim();
                    if (!t) return '';
                    if (/^<img\b/i.test(t)) return t;
                    return '<p>' + t.replace(/\n/g, '<br>') + '</p>';
                }).filter(Boolean);
            }

            function paginate(blocks) {
                var measure = document.createElement('div');
                measure.className = 'book-page-text book-front';
                measure.style.position = 'fixed';
                measure.style.left = '-9999px';
                measure.style.top = '0';
                measure.style.height = 'auto';
                measure.style.visibility = 'hidden';
                document.body.appendChild(measure);

                var pages = [];
        var current = '';
        var VOID = /^(br|img|hr|wbr)$/;
        var DIMS = window.__bookImgDims || {};
        // फोटो लोड भएको/नभएको चिन्ता नगरी उचाइ ठ्याक्कै नाप्न: फोटोको सट्टा त्यही उचाइको खाली बक्स राखेर नाप्ने
        function forMeasure(html) {
            return html.replace(/<img\b[^>]*?src="([^"]+)"[^>]*>/gi, function (m, src) {
                var d = DIMS[src]; if (!d || !d.w) return m;
                var sc = Math.min(1, 255 / d.w, 340 / d.h);
                return '<div style="height:' + Math.round(d.h * sc + 12) + 'px"></div>';
            });
        }
        function fits(html) { measure.innerHTML = forMeasure(html); return measure.scrollHeight <= PAGE_TARGET_HEIGHT; }
        function hasText(s) { return s.replace(/<[^>]+>/g, '').trim().length > 0; }
        function updateStack(stack, unit) {
            unit.replace(/<(\/?)([a-zA-Z][a-zA-Z0-9]*)[^>]*>/g, function (m, close, name) {
                name = name.toLowerCase();
                if (VOID.test(name) || /\/>$/.test(m)) return m;
                if (close) { for (var i = stack.length - 1; i >= 0; i--) { if (stack[i].name === name) { stack.splice(i, 1); break; } } }
                else stack.push({ name: name, open: m });
                return m;
            });
        }
        function openTags(stack) { return stack.map(function (s) { return s.open; }).join(''); }
        function closeTags(stack) { return stack.slice().reverse().map(function (s) { return '</' + s.name + '>'; }).join(''); }

        blocks.forEach(function (block) {
            if (fits(current + block)) { current += block; return; }
            if (!/^<p>/i.test(block)) {            // फोटो आदि: टुक्र्याउन मिल्दैन
                if (current) pages.push(current);
                current = block; return;
            }
            // लामो अनुच्छेद: शब्द-शब्दमा पाना भरेर अर्को पानामा सार्ने (केही पनि नकटियोस्)।
            // हरेक शब्दमा नाप्दा ढिलो हुने भएकाले binary search: प्रति पाना ~१० पटक मात्र नाप्ने।
            var inner = block.replace(/^<p>/i, '').replace(/<\/p>$/i, '');
            var units = inner.match(/\s+|(?:<[^>]+>|[^<\s])+/g) || [];
            var pos = 0, stack = [], lead = '';
            function build(k) {
                var st = stack.slice(), h = lead;
                for (var q = pos; q < k; q++) { h += units[q]; updateStack(st, units[q]); }
                return { h: h, st: st };
            }
            while (pos < units.length) {
                var hi = Math.min(units.length, pos + 260);
                var r = build(hi);
                var best = 0, bestR = null;
                if (fits(current + '<p>' + r.h + closeTags(r.st) + '</p>')) { best = hi; bestR = r; }
                else {
                    var lo = pos + 1, up = hi - 1;
                    while (lo <= up) {
                        var mid = (lo + up) >> 1;
                        var rm = build(mid);
                        if (fits(current + '<p>' + rm.h + closeTags(rm.st) + '</p>')) { best = mid; bestR = rm; lo = mid + 1; }
                        else up = mid - 1;
                    }
                }
                if (!best || !hasText(bestR.h)) {
                    if (current) { pages.push(current); current = ''; lead = ''; continue; }
                    best = Math.min(units.length, pos + 1); bestR = build(best);   // एक शब्द नै पाना भन्दा ठूलो (दुर्लभ)
                }
                if (best >= units.length) {
                    current += '<p>' + bestR.h + closeTags(bestR.st) + '</p>';
                    pos = units.length;
                } else {
                    pages.push(current + '<p>' + bestR.h.replace(/\s+$/, '') + closeTags(bestR.st) + '</p>');
                    current = '';
                    stack = bestR.st; lead = openTags(stack); pos = best;
                    while (pos < units.length && /^\s+$/.test(units[pos])) pos++;
                }
            }
        });
        if (current) pages.push(current);
        document.body.removeChild(measure);
        return pages;
            }

            function buildFlipBook(data, pages, colorStyle) {
                var title = data.title || '';
                var coverColor = data.coverColor || '#dc143c';
                var coverImage = data.coverImage || '';
                // मूल रिपोको edge-shading graphic सधैं देखिने गरी माथि तह लगाइन्छ; कभर फोटो (भए) त्यसमुनि।
                var coverStyle = "background-image:url('flipbook/images/flip_book_edge_shading.webp')" +
                    (coverImage ? ", url('" + coverImage + "')" : "") + ';' +
                    'background-size:cover' + (coverImage ? ',cover' : '') + ';' +
                    'background-position:center' + (coverImage ? ',center' : '') + ';' +
                    'background-repeat:no-repeat' + (coverImage ? ',no-repeat' : '') + ';' +
                    'background-color:' + coverColor + ';';

                var totalSheets = Math.max(1, Math.ceil(pages.length / 2));
                var html = '<input type="checkbox" id="cover_checkbox">';
                for (var i = 1; i <= totalSheets; i++) html += '<input type="checkbox" id="page' + i + '_checkbox">';

                html += '<div id="flip_book">';
                html += '<div class="front_cover" style="' + coverStyle + '"><label for="cover_checkbox" id="cover"></label></div>';

                for (var i = 1; i <= totalSheets; i++) {
                    var front = pages[(i - 1) * 2] || '';
                    var back = pages[(i - 1) * 2 + 1] || '';
                    html += '<div class="page" id="page' + i + '">' +
                        '<div class="front_page"><label for="page' + i + '_checkbox"></label>' +
                        '<img class="edge_shading" src="flipbook/images/front_page_edge_shading.webp" alt="">' +
                        '<div class="book-page-text book-front" style="' + colorStyle + '">' + front + '</div></div>' +
                        '<div class="back_page"><label for="page' + i + '_checkbox"></label>' +
                        '<img class="edge_shading" src="flipbook/images/back_page_edge_shading.webp" alt="">' +
                        '<div class="book-page-text book-back" style="' + colorStyle + '">' + back + '</div></div>' +
                        '</div>';
                }
                html += '<div class="back_cover" style="' + coverStyle + '"></div></div>';
                container.innerHTML = html;

                // पाना-अनुसारको z-index CSS गतिशील रूपमा थप्ने
                var rules = '';
                for (var i = 1; i <= totalSheets; i++) {
                    rules += '#page' + i + '{z-index:' + (totalSheets - i + 1) + ';}';
                    rules += '#page' + i + '_checkbox:checked~#flip_book #page' + i + '{transform:rotateY(-180deg);z-index:' + (totalSheets + i) + ';}';
                }
                var styleTag = document.createElement('style');
                styleTag.id = 'dynamicPageStyles';
                styleTag.textContent = rules;
                document.head.appendChild(styleTag);
            }

            function applyScale() {
                var wrap = document.getElementById('bookScaleWrap');
                var coverCheckbox = document.getElementById('cover_checkbox');
                if (!wrap) return;
                var isOpen = !!(coverCheckbox && coverCheckbox.checked);
                // बन्द हुँदा (कभर मात्र) एउटा पानाको चौडाइमा जुम-इन गरेर मोबाइल स्क्रिनमा फिट;
                // खोल्दा (दुई पाना देखिने) दोब्बर चौडाइमा जुम-आउट गरेर दुवै पाना फिट हुने।
                var TARGET_W = isOpen ? 596 : 298;
                var TARGET_H = 420;
                var availW = window.innerWidth - 24;
                var availH = window.innerHeight - 24;
                var scale = Math.min(availW / TARGET_W, availH / TARGET_H);
                if (!isOpen) scale = Math.min(scale, 1.6); // कभर अवस्थामा अत्यधिक ठूलो नहोस्
                wrap.style.transform = 'scale(' + scale + ')';
            }

            var withTimeout = function (p, ms) { return Promise.race([p, new Promise(function (r) { setTimeout(r, ms); })]); };
                // book.json तुरुन्तै तान्ने; फन्ट (यही टेक्स्टको अक्षर मात्र) र भित्री फोटो समानान्तर लोड गरेर
                // अधिकतम १.५ सेकेन्ड मात्र पर्खने — सबै फन्ट (document.fonts.ready) को लागि होइन।
                Promise.resolve(fetch('data/book.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }))
                    .then(function (data) {
                        var txt = String(data.text || '');
                        var sample = txt.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').slice(0, 300) || 'अ';
                        var fontP = (document.fonts && document.fonts.load)
                            ? document.fonts.load('500 17px Akshar', sample).catch(function () {}) : Promise.resolve();
                        var srcs = []; txt.replace(/<img[^>]+src="([^"]+)"/g, function (m, s) { srcs.push(s); return m; });
                        var imgP = Promise.all(srcs.map(function (s) {
                            return new Promise(function (res) { var im = new Image(); im.onload = function () { (window.__bookImgDims = window.__bookImgDims || {})[s] = { w: im.naturalWidth, h: im.naturalHeight }; res(); }; im.onerror = res; im.src = s; });
                        }));
                        return withTimeout(Promise.all([fontP, imgP]), 1500).then(function () { return data; });
                    })
                    .then(function (data) {
            var colorStyle = data.color ? 'color:' + data.color + ';' : '';
            var sample = String(data.text || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').slice(0, 300) || 'अ';
            var listenersBound = false;
            // धेरै पाना हुँदा सबै पाना 3D मा राख्दा फोन ढिलो/धमिलो हुन्छ — अहिले खुला किताब वरिपरिका पाना मात्र देखाउने
            function syncSheets() {
                var els = container.querySelectorAll('.page'), n = els.length, f = 0, i;
                for (i = 1; i <= n; i++) { var cb = document.getElementById('page' + i + '_checkbox'); if (cb && cb.checked) f++; }
                for (i = 1; i <= n; i++) els[i - 1].style.display = (i >= f - 2 && i <= f + 4) ? '' : 'none';
            }
            function build() {
                var old = document.getElementById('dynamicBookPageStyles'); if (old) old.remove();
                var pages = paginate(toBlocks(data.text));
                buildFlipBook(data, pages, colorStyle);
                applyScale();
                Array.prototype.forEach.call(container.querySelectorAll('input[type=checkbox]'), function (cb) { cb.addEventListener('change', syncSheets); });
                var cover = document.getElementById('cover_checkbox');
                if (cover) cover.addEventListener('change', applyScale);
                syncSheets();
                if (!listenersBound) {
                    window.addEventListener('resize', applyScale);
                    window.addEventListener('orientationchange', applyScale);
                    listenersBound = true;
                }
            }
            build();
            // पाना नाप्दा Akshar आइपुगेको थिएन भने (अर्कै फन्टले नापिएको) पाठकले छुनुअघि एकपटक फेरि मिलाउने
            if (document.fonts && document.fonts.check && document.fonts.load && !document.fonts.check('500 17px Akshar', sample)) {
                document.fonts.load('500 17px Akshar', sample).then(function () {
                    if (!container.querySelector('input[type=checkbox]:checked')) build();
                }).catch(function () {});
            }
        })
                .catch(function () {
                    container.innerHTML = '<p style="color:#fff;">किताब लोड गर्न सकिएन।</p>';
                });
        })();
    </script>
</body>

</html>
