<style>
  .news-page-inner { max-width: 1080px; margin: 0 auto; padding-top: 14px; }
  .news-feed-section { padding-top: 10px; padding-bottom: 10px; }
  #bookEmbedSection.news-feed-section { padding-bottom: 0; }

  /* ══ FLIP BOOK (समाचार १ को तल, किताब पृष्ठबाट सारिएको) — स्कोप गरिएको स्टाइल ══ */
  /* .news-feed-section बाट text-align:center inherit हुँदा भित्री position:absolute img हरू
     (जस्तै edge_shading) बीचमा सर्ने bug आउँथ्यो — यहाँ त्यो inheritance रोकिएको छ। */
  #bookEmbedWrap { display: flex; justify-content: center; align-items: flex-start; width: 100%; padding: 0; overflow: visible; text-align: left; transition: height 1s ease; }
  #bookEmbedWrap #bookScaleWrap { transform-origin: top center; transition: transform 1s ease; }

  #bookEmbedWrap #flip_book { width: 298px; height: 420px; position: relative; transition-duration: 1s; perspective: 2000px; }

  #bookEmbedWrap .front_cover,
  #bookEmbedWrap .back_cover {
    width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
    border-radius: 2.5px 5px 5px 2.5px; background-image: url(flipbook/images/flip_book_edge_shading.webp);
    background-size: cover; background-position: center; background-repeat: no-repeat;
    background-color: rgb(220, 20, 60); box-shadow: 0 0 5px 0 rgba(25,25,25,0.25);
  }
  /* मूल creative_coding-flip_book रिपोको जस्तै: एउटै सिंगो प्लेन, कुनै blur/preserve-3d/backface split छैन। */
  #bookEmbedWrap .front_cover {
    position: absolute; cursor: pointer; transform-origin: center left; transition: transform 0.5s; z-index: 99;
  }
  #bookEmbedWrap .front_cover label { width: 100%; height: 100%; position: absolute; cursor: pointer; }

  #bookEmbedWrap .page {
    width: 288px; height: 400px; position: absolute; top: 10px; left: 1px; border-radius: 0 5px 5px 0;
    background-color: white; transform-origin: left; transform-style: preserve-3d; transform: rotateY(0deg); transition-duration: 0.5s;
  }
  #bookEmbedWrap .front_page { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; }
  #bookEmbedWrap .front_page label { width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 100; }
  #bookEmbedWrap .back_page { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; transform: rotateY(180deg); z-index: 100; }
  #bookEmbedWrap .back_page label { width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 100; }
  #bookEmbedWrap .edge_shading { width: 288px; height: 400px; position: absolute; top: 0; left: 0; z-index: 98; }

  #bookEmbedWrap .back_cover { position: relative; z-index: -1; }

  #bookEmbedWrap #cover_checkbox:checked~#flip_book { transform: translateX(144px); }
  #bookEmbedWrap #cover_checkbox:checked~#flip_book .front_cover {
    transform: rotateY(-180deg); transition: transform 1.5s, z-index 0.5s 0.5s; z-index: 1;
  }
  #bookEmbedWrap #cover_checkbox:checked~#flip_book #cover { width: 80%; height: 80%; position: absolute; }

  #bookEmbedWrap .book-page-text {
    width: 287px; height: 398px; position: absolute; top: 1px; left: 0; background: #fdfaf5; box-sizing: border-box;
    padding: 22px 16px; overflow: hidden; font-family: 'Khand', 'Noto Sans Devanagari', sans-serif;
    font-size: 0.56rem; line-height: 1.4; text-align: justify; color: #1a1a1a; z-index: 97;
  }
  #bookEmbedWrap .book-page-text.book-front { border-radius: 0 5px 5px 0; }
  #bookEmbedWrap .book-page-text.book-back { left: 1px; border-radius: 5px 0 0 5px; }
  #bookEmbedWrap .book-page-text img { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
  #bookEmbedWrap .book-page-text p { margin: 0 0 0.6em; }
  #bookEmbedWrap .book-cover-title {
    color: #fff; font-family: 'Noto Serif Devanagari', serif; font-weight: 700; font-size: 1.1rem;
    text-align: center; padding: 0 16px; text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  #bookEmbedWrap input { display: none; }
</style>

<div id="headerSpacer"></div>
<script>
(function(){
  function scaleSiteHeader() {
    const header = document.getElementById('siteHeader');
    const spacer = document.getElementById('headerSpacer');
    if (!header) return;
    if (window.innerWidth < 1080) {
      const scale = window.innerWidth / 1080;
      header.style.transform = 'scale(' + scale + ')';
      if (spacer) spacer.style.height = (header.offsetHeight * scale) + 'px';
    } else {
      header.style.transform = '';
      if (spacer) spacer.style.height = '';
    }
    header.classList.add('top-ready');
  }
  scaleSiteHeader();
  window.addEventListener('load', scaleSiteHeader);
  window.addEventListener('resize', scaleSiteHeader);
  window.addEventListener('orientationchange', scaleSiteHeader);
})();
</script>
<script>
function toggleHeaderMenu() {
  const dropdown = document.getElementById('headerDropdown');
  const btn = document.getElementById('menuDotsBtn');
  if (!dropdown) return;
  const willOpen = !dropdown.classList.contains('open');
  dropdown.classList.toggle('open', willOpen);
  if (btn) btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}
document.addEventListener('click', function(e){
  const dropdown = document.getElementById('headerDropdown');
  const btn = document.getElementById('menuDotsBtn');
  if (!dropdown || !dropdown.classList.contains('open')) return;
  if (dropdown.contains(e.target) || (btn && btn.contains(e.target))) return;
  dropdown.classList.remove('open');
  if (btn) btn.setAttribute('aria-expanded', 'false');
});
</script>

<!-- NEWS FEED — data/news.json (3-column) र data/news2.json (1-column, फोटो जुनसुकै ठाउँमा) बाट -->
<script>
(function(){
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function toParagraphHtml(raw){
    var blocks = String(raw || '').split(/\n\s*\n/);
    return blocks.map(function(b){
      var trimmed = b.trim();
      if (!trimmed) return '';
      if (/^<img\b/i.test(trimmed)) return trimmed;
      // यहाँ HTML (<b>, <span style="color:...">, आदि) चल्छ — admin ले टाइप गरेको जस्ताको तस्तै देखिन्छ
      return '<p>' + trimmed.replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function loadNewsFeed(el, columnsClass){
    if (!el) return;
    var src = el.dataset.source;
    fetch(src, { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(items){
        if (!items || !items.length) {
          el.innerHTML = '<div class="news-feed-empty">हाल कुनै समाचार छैन।</div>';
          return;
        }
        el.innerHTML = items.map(function(item){
          var img = item.image ? '<img src="' + esc(item.image) + '" alt="' + esc(item.title) + '">' : '';
          var title = item.title ? '<h3>' + esc(item.title) + '</h3>' : '';
          var color = item.color ? 'color:' + esc(item.color) + ';' : '';
          return '<div class="news-feed-card">' + img +
                 '<div class="nf-body">' + title + '<div class="' + columnsClass + '" style="' + color + '">' + toParagraphHtml(item.text) + '</div></div></div>';
        }).join('');
      })
      .catch(function(){ el.innerHTML = '<div class="news-feed-empty">समाचार लोड गर्न सकिएन।</div>'; });
  }
  loadNewsFeed(document.getElementById('newsFeedList'), 'nf-columns');
  loadNewsFeed(document.getElementById('newsFeedList2'), 'nf-single');
})();
</script>

<!-- किताब (FLIP BOOK) — data/book.json बाट, book.html बाट सारिएको -->
<script>
(function () {
    var PAGE_TARGET_HEIGHT = 398;
    var container = document.getElementById('flipBookContainer');
    if (!container) return;

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    function toBlocks(raw) {
        return String(raw || '').split(/\n\s*\n/).map(function (b) {
            var t = b.trim();
            if (!t) return '';
            if (/^<img\b/i.test(t)) return t;
            return '<p>' + t.replace(/\n/g, '<br>') + '</p>';
        }).filter(Boolean);
    }

    function paginate(blocks) {
        var measure = document.createElement('div');
        measure.className = 'book-page-text book-front';
        measure.style.position = 'fixed';
        measure.style.left = '-9999px';
        measure.style.top = '0';
        measure.style.height = 'auto';
        measure.style.visibility = 'hidden';
        document.getElementById('bookEmbedWrap').appendChild(measure);

        var pages = [];
        var current = '';
        blocks.forEach(function (block) {
            var test = current + block;
            measure.innerHTML = test;
            if (current && measure.scrollHeight > PAGE_TARGET_HEIGHT) {
                pages.push(current);
                current = block;
            } else {
                current = test;
            }
        });
        if (current) pages.push(current);
        measure.remove();
        return pages;
    }

    function buildFlipBook(data, pages, colorStyle) {
        var title = data.title || '';
        var coverColor = data.coverColor || '#dc143c';
        var coverImage = data.coverImage || '';
        // मूल रिपोको edge-shading graphic सधैं देखिने गरी माथि तह लगाइन्छ; कभर फोटो (भए) त्यसमुनि।
        var coverStyle = "background-image:url('flipbook/images/flip_book_edge_shading.webp')" +
            (coverImage ? ", url('" + coverImage + "')" : "") + ';' +
            'background-size:cover' + (coverImage ? ',cover' : '') + ';' +
            'background-position:center' + (coverImage ? ',center' : '') + ';' +
            'background-repeat:no-repeat' + (coverImage ? ',no-repeat' : '') + ';' +
            'background-color:' + coverColor + ';';

        var totalSheets = Math.max(1, Math.ceil(pages.length / 2));
        var html = '<input type="checkbox" id="cover_checkbox">';
        for (var i = 1; i <= totalSheets; i++) html += '<input type="checkbox" id="page' + i + '_checkbox">';

        html += '<div id="flip_book">';
        html += '<div class="front_cover" style="' + coverStyle + '"><label for="cover_checkbox" id="cover"></label></div>';

        for (var i = 1; i <= totalSheets; i++) {
            var front = pages[(i - 1) * 2] || '';
            var back = pages[(i - 1) * 2 + 1] || '';
            html += '<div class="page" id="bookPage' + i + '">' +
                '<div class="front_page"><label for="page' + i + '_checkbox"></label>' +
                '<img class="edge_shading" src="flipbook/images/front_page_edge_shading.webp" alt="">' +
                '<div class="book-page-text book-front" style="' + colorStyle + '">' + front + '</div></div>' +
                '<div class="back_page"><label for="page' + i + '_checkbox"></label>' +
                '<img class="edge_shading" src="flipbook/images/back_page_edge_shading.webp" alt="">' +
                '<div class="book-page-text book-back" style="' + colorStyle + '">' + back + '</div></div>' +
                '</div>';
        }
        html += '<div class="back_cover"></div></div>';
        container.innerHTML = html;

        var rules = '';
        for (var i = 1; i <= totalSheets; i++) {
            rules += '#bookPage' + i + '{z-index:' + (totalSheets - i + 1) + ';}';
            rules += '#page' + i + '_checkbox:checked~#flip_book #bookPage' + i + '{transform:rotateY(-180deg);z-index:' + (totalSheets + i) + ';}';
        }
        var styleTag = document.createElement('style');
        styleTag.id = 'dynamicBookPageStyles';
        styleTag.textContent = rules;
        document.head.appendChild(styleTag);
    }

    function applyScale() {
        var host = document.getElementById('bookEmbedWrap');
        var wrap = document.getElementById('bookScaleWrap');
        var coverCheckbox = document.getElementById('cover_checkbox');
        if (!host || !wrap) return;
        var isOpen = !!(coverCheckbox && coverCheckbox.checked);
        // बन्द हुँदा (कभर मात्र) एउटा पानाको चौडाइमा जुम-इन गरेर मोबाइल स्क्रिनमा फिट;
        // खोल्दा (दुई पाना देखिने) दोब्बर चौडाइमा जुम-आउट गरेर दुवै पाना फिट हुने।
        var TARGET_W = isOpen ? 596 : 298;
        var availW = host.clientWidth - 16;
        var scale = availW / TARGET_W;
        if (!isOpen) scale = Math.min(scale, 1.6); // कभर अवस्थामा अत्यधिक ठूलो नहोस्
        wrap.style.transform = 'scale(' + scale + ')';
        host.style.height = Math.round(420 * scale) + 'px';
    }

    var withTimeout = function (p, ms) { return Promise.race([p, new Promise(function (r) { setTimeout(r, ms); })]); };
        // book.json तुरुन्तै तान्ने; फन्ट (यही टेक्स्टको अक्षर मात्र) र भित्री फोटो समानान्तर लोड गरेर
        // अधिकतम १.५ सेकेन्ड मात्र पर्खने — सबै फन्ट (document.fonts.ready) को लागि होइन।
        Promise.resolve(fetch('data/book.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }))
            .then(function (data) {
                var txt = String(data.text || '');
                var sample = txt.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').slice(0, 300) || 'अ';
                var fontP = (document.fonts && document.fonts.load)
                    ? document.fonts.load('400 9px Khand', sample).catch(function () {}) : Promise.resolve();
                var srcs = []; txt.replace(/<img[^>]+src="([^"]+)"/g, function (m, s) { srcs.push(s); return m; });
                var imgP = Promise.all(srcs.map(function (s) {
                    return new Promise(function (res) { var im = new Image(); im.onload = im.onerror = res; im.src = s; });
                }));
                return withTimeout(Promise.all([fontP, imgP]), 1500).then(function () { return data; });
            })
            .then(function (data) {
            var blocks = toBlocks(data.text);
            var pages = paginate(blocks);
            var colorStyle = data.color ? 'color:' + data.color + ';' : '';
            buildFlipBook(data, pages, colorStyle);
            applyScale();
            window.addEventListener('resize', applyScale);
            window.addEventListener('orientationchange', applyScale);
            var coverCheckbox = document.getElementById('cover_checkbox');
            if (coverCheckbox) coverCheckbox.addEventListener('change', applyScale);
        })
        .catch(function () {
            container.innerHTML = '<p style="color:#5c2f26;">किताब लोड गर्न सकिएन।</p>';
        });
})();
</script>

<!-- AD CAROUSEL — data/ads.json बाट, auto-only crossfade (no manual swipe, no dots) -->
<script>
(function(){
  var wrap = document.getElementById('adCarousel');
  if (!wrap) return;
  var track = document.getElementById('adCarouselTrack');
  var src = wrap.dataset.source;

  fetch(src, { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(items){
      if (!items || !items.length) { wrap.style.display = 'none'; return; }
      track.innerHTML = items.map(function(item){
        return '<div class="ad-slide"><img src="' + item.image + '" alt="विज्ञापन"></div>';
      }).join('');
      var slides = track.children;
      if (slides.length) slides[0].classList.add('active');

      if (slides.length > 1) {
        var idx = 0;
        setInterval(function(){
          slides[idx].classList.remove('active');
          idx = (idx + 1) % slides.length;
          slides[idx].classList.add('active');
        }, 3500);
      }
    })
    .catch(function(){ wrap.style.display = 'none'; });
})();
</script>

<script>
