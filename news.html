<!-- NEWS FEED — data/news.json (3-column) र data/news2.json (1-column, फोटो जुनसुकै ठाउँमा) बाट -->
<script>
(function(){
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function toParagraphHtml(raw){
    var blocks = String(raw || '').split(/\n\s*\n/);
    return blocks.map(function(b){
      var trimmed = b.trim();
      if (!trimmed) return '';
      if (/^<img\b/i.test(trimmed)) return trimmed;
      // यहाँ HTML (<b>, <span style="color:...">, आदि) चल्छ — admin ले टाइप गरेको जस्ताको तस्तै देखिन्छ
      return '<p>' + trimmed.replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }
  function loadNewsFeed(el, columnsClass){
    if (!el) return;
    var src = el.dataset.source;
    fetch(src, { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(items){
        if (!items || !items.length) {
          el.innerHTML = '<div class="news-feed-empty">हाल कुनै समाचार छैन।</div>';
          return;
        }
        el.innerHTML = items.map(function(item){
          var img = item.image ? '<img src="' + esc(item.image) + '" alt="' + esc(item.title) + '">' : '';
          var title = item.title ? '<h3>' + esc(item.title) + '</h3>' : '';
          var color = item.color ? 'color:' + esc(item.color) + ';' : '';
          return '<div class="news-feed-card">' + img +
                 '<div class="nf-body">' + title + '<div class="' + columnsClass + '" style="' + color + '">' + toParagraphHtml(item.text) + '</div></div></div>';
        }).join('');
      })
      .catch(function(){ el.innerHTML = '<div class="news-feed-empty">समाचार लोड गर्न सकिएन।</div>'; });
  }
  loadNewsFeed(document.getElementById('newsFeedList'), 'nf-columns');
  loadNewsFeed(document.getElementById('newsFeedList2'), 'nf-single');
})();
</script>

<!-- AD CAROUSEL — data/ads.json बाट, auto + manual swipe, loop -->
<script>
(function(){
  var wrap = document.getElementById('adCarousel');
  if (!wrap) return;
  var track = document.getElementById('adCarouselTrack');
  var dotsWrap = document.getElementById('adCarouselDots');
  var src = wrap.dataset.source;

  fetch(src, { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(items){
      if (!items || !items.length) { wrap.style.display = 'none'; return; }
      track.innerHTML = items.map(function(item){
        return '<div class="ad-slide"><img src="' + item.image + '" alt="विज्ञापन"></div>';
      }).join('');
      var slides = track.children;
      dotsWrap.innerHTML = '';
      for (var i = 0; i < slides.length; i++) {
        var d = document.createElement('span');
        d.dataset.index = i;
        if (i === 0) d.classList.add('active');
        d.addEventListener('click', function(){
          track.scrollTo({ left: track.clientWidth * (+this.dataset.index), behavior: 'smooth' });
        });
        dotsWrap.appendChild(d);
      }
      var dots = dotsWrap.children;
      function currentIndex(){ return Math.round(track.scrollLeft / track.clientWidth); }
      function setActive(idx){ for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('active', i === idx); }
      track.addEventListener('scroll', function(){ setActive(currentIndex()); }, { passive: true });

      if (slides.length > 1) {
        var autoTimer = null;
        function nextSlide(){
          var next = (currentIndex() + 1) % slides.length;
          track.scrollTo({ left: track.clientWidth * next, behavior: 'smooth' });
        }
        function startAuto(){ stopAuto(); autoTimer = setInterval(nextSlide, 3500); }
        function stopAuto(){ if (autoTimer) clearInterval(autoTimer); }
        startAuto();
        track.addEventListener('pointerdown', stopAuto);
        track.addEventListener('pointerup', function(){ setTimeout(startAuto, 1800); });
        track.addEventListener('mouseleave', function(){ setTimeout(startAuto, 1800); });
      }
    })
    .catch(function(){ wrap.style.display = 'none'; });
})();
</script>

if ('serviceWorker' in navigator) {
