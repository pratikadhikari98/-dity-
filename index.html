<script>
function scaleDesktopTop() {
  const header = document.getElementById('siteHeader');
  const spacer = document.getElementById('headerSpacer');
  const wrap = document.getElementById('desktopTopWrap');
  const inner = document.getElementById('desktopTopInner');
  if (!header || !wrap || !inner) return;
  if (window.innerWidth < 1080) {
    const scale = window.innerWidth / 1080;
    header.style.transform = 'scale(' + scale + ')';
    if (spacer) spacer.style.height = (header.offsetHeight * scale) + 'px';
    inner.style.transform = 'scale(' + scale + ')';
    inner.style.transformOrigin = 'top left';
    wrap.style.height = (inner.offsetHeight * scale) + 'px';
  } else {
    header.style.transform = '';
    if (spacer) spacer.style.height = '';
    inner.style.transform = '';
    wrap.style.height = '';
  }
  header.classList.add('top-ready');
  wrap.classList.add('top-ready');
}
scaleDesktopTop();
window.addEventListener('load', scaleDesktopTop);
window.addEventListener('resize', scaleDesktopTop);
window.addEventListener('orientationchange', scaleDesktopTop);
</script>

<script>
function toggleHeaderMenu() {
  const dropdown = document.getElementById('headerDropdown');
  const btn = document.getElementById('menuDotsBtn');
  if (!dropdown) return;
  const willOpen = !dropdown.classList.contains('open');
  dropdown.classList.toggle('open', willOpen);
  if (btn) btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}
document.addEventListener('click', function(e){
  const dropdown = document.getElementById('headerDropdown');
  const btn = document.getElementById('menuDotsBtn');
  if (!dropdown || !dropdown.classList.contains('open')) return;
  if (dropdown.contains(e.target) || (btn && btn.contains(e.target))) return;
  dropdown.classList.remove('open');
  if (btn) btn.setAttribute('aria-expanded', 'false');
});
</script>

<script>
// ── WHEEL CENTER ANALOGUE CLOCK ──
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const CX = 160, CY = 160, R = 48; // clock radius (inner ring)
  const tg = document.getElementById('clockTicks');

  // Draw tick marks & Nepali numerals
  const nums = ['१२','१','२','३','४','५','६','७','८','९','१०','११'];
  for (let i = 0; i < 60; i++) {
    const rad = i * 6 * Math.PI / 180;
    const isHour = i % 5 === 0, isQ = i % 15 === 0;
    const r1 = R, r2 = isQ ? R - 8 : isHour ? R - 6 : R - 3;
    const sw = isQ ? 2 : isHour ? 1.4 : 0.7;
    const op = isQ ? '0.7' : isHour ? '0.5' : '0.2';
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', CX + r1 * Math.sin(rad));
    line.setAttribute('y1', CY - r1 * Math.cos(rad));
    line.setAttribute('x2', CX + r2 * Math.sin(rad));
    line.setAttribute('y2', CY - r2 * Math.cos(rad));
    line.setAttribute('stroke', '#5c2f26');
    line.setAttribute('stroke-width', sw);
    line.setAttribute('opacity', op);
    line.setAttribute('stroke-linecap', 'round');
    tg.appendChild(line);
  }
  for (let i = 0; i < 12; i++) {
    const rad = i * 30 * Math.PI / 180;
    const isQ = i % 3 === 0;
    const nr = isQ ? R - 14 : R - 13;
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x', CX + nr * Math.sin(rad));
    txt.setAttribute('y', CY - nr * Math.cos(rad));
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('dominant-baseline', 'central');
    txt.setAttribute('font-size', isQ ? '7' : '6');
    txt.setAttribute('font-weight', isQ ? '700' : '600');
    txt.setAttribute('fill', '#5c2f26');
    txt.setAttribute('opacity', isQ ? '0.75' : '0.5');
    txt.setAttribute('font-family', 'Noto Sans Devanagari, sans-serif');
    txt.textContent = nums[i];
    tg.appendChild(txt);
  }

  function rot(id, deg) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('transform', `rotate(${deg},${CX},${CY})`);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const h24 = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const h12 = h24 % 12 || 12;
    const ampm = h24 < 12 ? 'AM' : 'PM';
    rot('wHourHand',   (h24 % 12) * 30 + m * 0.5);
    rot('wMinuteHand', m * 6  + s * 0.1);
    rot('wSecondHand', s * 6);
    const el = document.getElementById('wheelDigitalTime');
    const NP = n => String(n).replace(/[0-9]/g, d => '०१२३४५६७८९'[+d]);
    const ampmNP = h24 < 12 ? 'बिहान' : h24 < 17 ? 'दिउँसो' : 'बेलुकी';
    if (el) el.textContent = NP(pad(h12)) + ':' + NP(pad(m)) + ':' + NP(pad(s)) + ' ' + ampmNP;
  }

  tick();
  setInterval(tick, 1000);
})();
</script>

<script>
(function () {
  const wrap  = document.getElementById('wheelWrap');
  const group = document.getElementById('wheelGroup');
  const CX = 160, CY = 160;
  const VB_SIZE = 320; // viewBox logical size (before the -5 offset)

  const AUTO_SPEED = 1.20;   // deg/frame — छिटो spin
  const FRICTION   = 0.97;
  const MIN_VEL    = 0.05;

  let angle    = 0;
  let velocity = AUTO_SPEED; // start with auto-spin speed
  let dragging = false;
  let prevMouseAngle = 0;
  let lastTime = 0;
  let rafId    = null;

  /* Convert client coords → angle (deg) from wheel center */
  function clientToAngle(e) {
    const rect = wrap.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    // Map to viewBox coords (viewBox is "-5 -5 330 330", so offset by 5)
    const svgX = ((cx - rect.left) / rect.width)  * 330 - 5;
    const svgY = ((cy - rect.top)  / rect.height) * 330 - 5;
    return Math.atan2(svgY - CY, svgX - CX) * (180 / Math.PI);
  }

  function applyRotation() {
    group.setAttribute('transform', `rotate(${angle},${CX},${CY})`);
  }

  /* Main animation loop — always running */
  function loop() {
    if (!dragging) {
      if (Math.abs(velocity) < MIN_VEL) {
        // Smoothly restore auto-spin direction
        velocity += (AUTO_SPEED - velocity) * 0.05;
      } else {
        velocity *= FRICTION;
        // Once slow enough, nudge back toward auto
        if (Math.abs(velocity) < AUTO_SPEED * 2) {
          velocity += (AUTO_SPEED - velocity) * 0.02;
        }
      }
      angle += velocity;
      applyRotation();
    }
    rafId = requestAnimationFrame(loop);
  }

  /* Drag start */
  function onStart(e) {
    e.preventDefault();
    dragging = true;
    velocity = 0;
    prevMouseAngle = clientToAngle(e);
    lastTime = performance.now();
  }

  /* Drag move */
  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const now = performance.now();
    const dt  = Math.max(now - lastTime, 1);
    const cur = clientToAngle(e);
    let delta = cur - prevMouseAngle;
    if (delta >  180) delta -= 360;
    if (delta < -180) delta += 360;

    velocity = delta / dt * 16; // scale to per-frame
    angle   += delta;
    applyRotation();
    prevMouseAngle = cur;
    lastTime = now;
  }

  /* Drag end — let inertia + loop take over */
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    // clamp velocity so it doesn't spin wildly
    velocity = Math.max(-8, Math.min(8, velocity));
  }

  // Mouse
  wrap.addEventListener('mousedown',  onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onEnd);
  // Touch
  wrap.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend',  onEnd);

  // Kick off loop
  loop();
})();
</script>

<script>
// ══ RESULT SEARCH LOGIC ══
async function searchResult() {
  const name  = document.getElementById('rmName').value.trim();
  const dob   = document.getElementById('rmDOB').value.trim();
  const year  = document.getElementById('rmYear').value;
  const cls   = document.getElementById('rmClass').value;
  const exam  = document.getElementById('rmExam').value;
  const errEl = document.getElementById('rmError');
  errEl.style.display = 'none';

  if (!name || !dob || !year || !cls || !exam) {
    errEl.textContent = 'कृपया सबै खाना भर्नुहोस्।';
    errEl.style.display = 'block';
    return;
  }

  // JSON path: Results/2083/traimasik/class6.json
  const path = `Results/${year}/${exam}/${cls}.json`;

  let data;
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error('not found');
    data = await res.json();
  } catch {
    errEl.textContent = 'नतिजा फाइल फेला परेन। ('+path+')';
    errEl.style.display = 'block';
    return;
  }

  // Search student by name + dob (case-insensitive, trim)
  const student = (data.students || []).find(s =>
    s.name.trim().toLowerCase() === name.toLowerCase() &&
    s.dob.trim() === dob
  );

  if (!student) {
    errEl.textContent = 'नाम वा जन्ममिति मिलेन। पुनः जाँच गर्नुहोस्।';
    errEl.style.display = 'block';
    return;
  }

  // Fill result display
  const examLabels = { traimasik: 'त्रैमासिक', ardhavaarshik: 'अर्धवार्षिक', vaarshik: 'वार्षिक' };
  const clsLabels  = { class6:'कक्षा ६', class7:'कक्षा ७', class8:'कक्षा ८', class9:'कक्षा ९', class10:'कक्षा १०', class11:'कक्षा ११', class12:'कक्षा १२' };

  document.getElementById('rdName').textContent = '🎓 ' + student.name;
  document.getElementById('rdMeta').textContent =
    `जन्ममिति: ${student.dob} | ${clsLabels[cls]} | ${examLabels[exam]} परीक्षा | वर्ष: ${year}`;

  const tbody = document.getElementById('rdBody');
  tbody.innerHTML = '';
  let total = 0, maxTotal = 0;

  (student.subjects || []).forEach(sub => {
    const tr = document.createElement('tr');
    const grade = getGrade(sub.obtained, sub.full);
    tr.innerHTML = `<td>${sub.name}</td><td>${sub.full}</td><td>${sub.obtained}</td><td>${grade}</td>`;
    tbody.appendChild(tr);
    total    += sub.obtained;
    maxTotal += sub.full;
  });

  const pct = maxTotal ? Math.round(total / maxTotal * 100) : 0;
  document.getElementById('rdTotal').textContent =
    `जम्मा: ${total} / ${maxTotal}  (${pct}%)`;

  document.getElementById('resultModal').style.display  = 'none';
  document.getElementById('resultDisplay').style.display = 'flex';
}

function getGrade(obt, full) {
  if (!full) return '—';
  const p = obt / full * 100;
  if (p >= 90) return 'A+';
  if (p >= 80) return 'A';
  if (p >= 70) return 'B+';
  if (p >= 60) return 'B';
  if (p >= 50) return 'C+';
  if (p >= 40) return 'C';
  if (p >= 35) return 'D';
  return 'NG';
}

// Close modal on backdrop click
['resultModal','resultDisplay'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
  });
});
</script>

<!-- SHOWCASE SLIDER — loads slides from data/showcase.json, auto + manual swipe -->
<script>
(function(){
  function escapeHtml(s){ var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

  function initSlider(slider, items){
    var track = slider.querySelector('.showcase-slides');
    var dotsWrap = slider.querySelector('.showcase-dots');
    if (!track || !items || !items.length) return;

    track.innerHTML = items.map(function(item){
      return '<div class="showcase-top showcase-slide">' +
               '<div class="showcase-text"><p>' + escapeHtml(item.text) + '</p></div>' +
               '<div class="showcase-photo"><img src="' + escapeHtml(item.image) + '" alt="ADITYA"></div>' +
             '</div>';
    }).join('');

    var slides = track.children;
    dotsWrap.innerHTML = '';
    for (var i = 0; i < slides.length; i++) {
      var d = document.createElement('span');
      d.dataset.index = i;
      if (i === 0) d.classList.add('active');
      d.addEventListener('click', function(){
        var idx = +this.dataset.index;
        track.scrollTo({ left: track.clientWidth * idx, behavior: 'smooth' });
      });
      dotsWrap.appendChild(d);
    }
    var dots = dotsWrap.children;

    function currentIndex(){
      return Math.round(track.scrollLeft / track.clientWidth);
    }
    function setActive(idx){
      for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('active', i === idx);
    }
    track.addEventListener('scroll', function(){ setActive(currentIndex()); }, { passive: true });

    if (slides.length > 1) {
      var autoTimer = null;
      function nextSlide(){
        var next = (currentIndex() + 1) % slides.length;
        track.scrollTo({ left: track.clientWidth * next, behavior: 'smooth' });
      }
      function startAuto(){ stopAuto(); autoTimer = setInterval(nextSlide, 4500); }
      function stopAuto(){ if (autoTimer) clearInterval(autoTimer); }
      startAuto();
      track.addEventListener('pointerdown', stopAuto);
      track.addEventListener('pointerup', function(){ setTimeout(startAuto, 1800); });
      track.addEventListener('mouseleave', function(){ setTimeout(startAuto, 1800); });
    }
  }

  document.querySelectorAll('.showcase-slider').forEach(function(slider){
    var src = slider.dataset.source;
    if (!src) return;
    fetch(src, { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(items){ initSlider(slider, items); })
      .catch(function(){ /* JSON load गर्न सकिएन */ });
  });
})();
</script>

<!-- SHLOKA ROTATOR — data/shlokas.json बाट हरेक 5 सेकेन्डमा अर्को श्लोक -->
<script>
(function(){
  var rotator = document.getElementById('shlokaRotator');
  if (!rotator) return;
  var src = rotator.dataset.source;
  var textEl = document.getElementById('shlokaText');
  var meaningEl = document.getElementById('shlokaMeaning');

  fetch(src, { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(items){
      if (!items || !items.length) return;
      var idx = 0;
      function render(i){
        textEl.innerHTML = String(items[i].shloka || '').split('\n').map(function(line){
          var d = document.createElement('div'); d.textContent = line; return d.innerHTML;
        }).join('<br>');
        meaningEl.textContent = items[i].meaning || '';
      }
      render(0);
      if (items.length > 1) {
        setInterval(function(){
          rotator.classList.add('fading');
          setTimeout(function(){
            idx = (idx + 1) % items.length;
            render(idx);
            rotator.classList.remove('fading');
          }, 350);
        }, 5000);
      }
    })
    .catch(function(){ /* लोड गर्न सकिएन */ });
})();
</script>
