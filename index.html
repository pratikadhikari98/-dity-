<style>
  .news-page-inner { max-width: 1080px; margin: 0 auto; padding-top: 14px; }
  .news-feed-section { padding-top: 10px; padding-bottom: 10px; }
  #bookEmbedSection.news-feed-section { padding-bottom: 0; }

  /* ══ FLIP BOOK (समाचार १ को तल, किताब पृष्ठबाट सारिएको) — स्कोप गरिएको स्टाइल ══ */
  /* .news-feed-section बाट text-align:center inherit हुँदा भित्री position:absolute img हरू
     (जस्तै edge_shading) बीचमा सर्ने bug आउँथ्यो — यहाँ त्यो inheritance रोकिएको छ। */
  #bookEmbedWrap { display: flex; justify-content: center; align-items: flex-start; width: 100%; padding: 0; overflow: visible; text-align: left; transition: height 1s ease; }
  #bookEmbedWrap #bookScaleWrap { transform-origin: top center; transition: transform 1s ease; }

  #bookEmbedWrap #flip_book { width: 298px; height: 420px; position: relative; transition-duration: 1s; perspective: 2000px; }

  #bookEmbedWrap .front_cover,
  #bookEmbedWrap .back_cover {
    width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
    border-radius: 2.5px 5px 5px 2.5px; background-image: url(flipbook/images/flip_book_edge_shading.webp);
    background-size: cover; background-position: center; background-repeat: no-repeat;
    background-color: rgb(220, 20, 60); box-shadow: 0 0 5px 0 rgba(25,25,25,0.25);
  }
  /* मूल creative_coding-flip_book रिपोको जस्तै: एउटै सिंगो प्लेन, कुनै blur/preserve-3d/backface split छैन। */
  #bookEmbedWrap .front_cover {
    position: absolute; cursor: pointer; transform-origin: center left; transition: transform 0.5s; z-index: 99;
  }
  #bookEmbedWrap .front_cover label { width: 100%; height: 100%; position: absolute; cursor: pointer; }

  #bookEmbedWrap .page {
    width: 288px; height: 400px; position: absolute; top: 10px; left: 1px; border-radius: 0 5px 5px 0;
    background-color: white; transform-origin: left; transform-style: preserve-3d; transform: rotateY(0deg); transition-duration: 0.5s;
  }
  #bookEmbedWrap .front_page { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; }
  #bookEmbedWrap .front_page label { width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 100; }
  #bookEmbedWrap .back_page { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; transform: rotateY(180deg); z-index: 100; }
  #bookEmbedWrap .back_page label { width: 100%; height: 100%; position: absolute; cursor: pointer; z-index: 100; }
  #bookEmbedWrap .edge_shading { width: 288px; height: 400px; position: absolute; top: 0; left: 0; z-index: 98; }

  #bookEmbedWrap .back_cover { position: relative; z-index: -1; }

  #bookEmbedWrap #cover_checkbox:checked~#flip_book { transform: translateX(144px); }
  #bookEmbedWrap #cover_checkbox:checked~#flip_book .front_cover {
    transform: rotateY(-180deg); transition: transform 1.5s, z-index 0.5s 0.5s; z-index: 1;
  }
  #bookEmbedWrap #cover_checkbox:checked~#flip_book #cover { width: 80%; height: 80%; position: absolute; }

  #bookEmbedWrap .book-page-text {
    width: 287px; height: 398px; position: absolute; top: 1px; left: 0; background: #fdfaf5; box-sizing: border-box;
    padding: 22px 16px; overflow: hidden; font-family: 'Khand', 'Noto Sans Devanagari', sans-serif;
    font-size: 0.56rem; line-height: 1.4; text-align: justify; color: #1a1a1a; z-index: 97;
  }
  #bookEmbedWrap .book-page-text.book-front { border-radius: 0 5px 5px 0; }
  #bookEmbedWrap .book-page-text.book-back { left: 1px; border-radius: 5px 0 0 5px; }
  #bookEmbedWrap .book-page-text img { max-width: 100%; border-radius: 6px; display: block; margin: 6px 0; }
  #bookEmbedWrap .book-page-text p { margin: 0 0 0.6em; }
  #bookEmbedWrap .book-cover-title {
    color: #fff; font-family: 'Noto Serif Devanagari', serif; font-weight: 700; font-size: 1.1rem;
    text-align: center; padding: 0 16px; text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  #bookEmbedWrap input { display: none; }

  /* swipe card+text र समाचार १ बीचको खाली ठाउँ घटाइएको; dots हटाइयो */
  .showcase-section { padding-bottom: 6px; }
  .showcase-dots { display: none; }
  .news-page-inner { padding-top: 0; }
  #news > .news-feed-section:first-child { padding-top: 0; }

  /* समाचार १ र २ — स्क्रिनको दुवै छेउ छुने (full-width) */
  @media (max-width: 1080px) {
    #news > .news-feed-section:not(#bookEmbedSection) { padding-left: 0; padding-right: 0; }
    #news .news-feed-list { max-width: none; }
    #news .news-feed-card { border-radius: 0; }
    #news .ad-carousel { margin-left: 5%; margin-right: 5%; }
  }

  /* समाचार १ र २ का शीर्षक बीचमा */
  #news .news-feed-card h3 { text-align: center; font-family: 'Ananda Devanagari Round', 'Noto Serif Devanagari', serif; font-weight: normal; -webkit-text-stroke: 0.5px currentColor; /* फन्टमा Bold छैन — हल्का रेखा थपेर बोल्ड बनाइएको */ font-size: 1.9rem; line-height: 1.35; }
  /* फ्लिप किताब र समाचार २ बीचको ठाउँ अलि बढाइएको */
  #news > .news2-section { padding-top: 30px; }
  .site-h1 { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  /* ── प्रतीक साहित्य संग्रहबाट random कविता (कभर → छोएपछि कविता खुल्छ) ── */
  .poem-section { margin-top: 18px; }
  .pf-box { background: var(--white); border: 1px solid var(--sky); border-radius: 16px; padding: 16px; box-shadow: 0 4px 18px rgba(147,84,71,.08); }
  .pf-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .pf-head h2 { font-size: 1.15rem; color: var(--blue-dark); margin: 0; }
  .pf-shuffle { background: var(--white); border: 1.5px solid var(--blue-mid); color: var(--blue-mid); font-family: inherit; font-weight: 700; font-size: .85rem; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .pf-shuffle:active { background: var(--blue-mid); color: var(--white); }
  .pf-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 16px; }
  @media (min-width: 760px) { .pf-grid { grid-template-columns: repeat(4, 1fr); } }
  .pf-item { cursor: pointer; outline: none; transition: transform .15s ease; }
  .pf-item:active { transform: scale(.96); }
  @media (hover: hover) and (pointer: fine) { .pf-item:hover { transform: translateY(-4px); } }
  .pf-book { width: 100%; aspect-ratio: 298 / 420; }
  /* प्रतीक साहित्य संग्रहकै कभर: किताब जस्तो कुना + edge shading + हल्का छाया */
  .pf-face { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 2.5px 5px 5px 2.5px; overflow: hidden; background-color: var(--cover-color, rgb(220, 20, 60)); box-shadow: 0 0 5px 0 rgba(25, 25, 25, 0.25); }
  .pf-face::after { content: ""; position: absolute; inset: 0; background: url("photos/book_edge_shading.webp") center / 100% 100% no-repeat; pointer-events: none; z-index: 2; }
  .pf-face > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pf-text-cover { position: absolute; inset: 9% 9% 9% 15%; border: 1px solid rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; padding: 8px; text-align: center; }
  .pf-text-title { color: #fff; font-weight: 700; line-height: 1.35; font-size: clamp(14px, 4.6vw, 20px); text-shadow: 0 1px 3px rgba(0,0,0,.35); word-break: break-word; }
  .pf-info { padding: 8px 2px 0; text-align: left; }
  .pf-cat { display: inline-block; font-size: 10px; letter-spacing: .5px; color: var(--blue-mid); background: var(--sky); padding: 2px 9px; border-radius: 20px; font-weight: 600; margin-bottom: 6px; }
  .pf-title { font-weight: 600; font-size: 15px; line-height: 1.35; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pf-rt { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--sky); font-size: 10px; color: var(--text-light); }
  .pf-foot { margin-top: 12px; text-align: center; font-size: .88rem; }
  .pf-foot a { color: var(--blue-mid); font-weight: 700; text-decoration: none; }
  .pf-modal { position: fixed; inset: 0; z-index: 9999; background: rgba(40,20,15,.6); display: flex; align-items: center; justify-content: center; padding: 14px; }
  .pf-modal[hidden] { display: none; }

<!-- माथिल्लो भाग (header+hero+stats) लाई मोबाइलमा पनि desktop layout जस्तै देखाउने स्केलिङ — glitch/flash नहोस् भनेर सुरुमै (rest of page अगाडि) चलाइन्छ -->
<script>
function scaleDesktopTop() {
  const header = document.getElementById('siteHeader');
  const spacer = document.getElementById('headerSpacer');
  const wrap = document.getElementById('desktopTopWrap');
  const inner = document.getElementById('desktopTopInner');
  if (!header || !wrap || !inner) return;
  if (window.innerWidth < 1080) {
    const scale = window.innerWidth / 1080;
    header.style.transform = 'scale(' + scale + ')';
    if (spacer) spacer.style.height = (header.offsetHeight * scale) + 'px';
    inner.style.transform = 'scale(' + scale + ')';
    inner.style.transformOrigin = 'top left';
    wrap.style.height = (inner.offsetHeight * scale) + 'px';
  } else {
    header.style.transform = '';
    if (spacer) spacer.style.height = '';
    inner.style.transform = '';
    wrap.style.height = '';
  }
  header.classList.add('top-ready');
  wrap.classList.add('top-ready');
}
scaleDesktopTop();
window.addEventListener('load', scaleDesktopTop);
window.addEventListener('resize', scaleDesktopTop);
window.addEventListener('orientationchange', scaleDesktopTop);
</script>

<script>
function toggleHeaderMenu() {
  const dropdown = document.getElementById('headerDropdown');
  const btn = document.getElementById('menuDotsBtn');
  if (!dropdown) return;
  const willOpen = !dropdown.classList.contains('open');
  dropdown.classList.toggle('open', willOpen);
  if (btn) btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}
document.addEventListener('click', function(e){
  const dropdown = document.getElementById('headerDropdown');
  const btn = document.getElementById('menuDotsBtn');
  if (!dropdown || !dropdown.classList.contains('open')) return;
  if (dropdown.contains(e.target) || (btn && btn.contains(e.target))) return;
  dropdown.classList.remove('open');
  if (btn) btn.setAttribute('aria-expanded', 'false');
});
</script>

  var PT_HALF = {'क':'S','ख':'V','ग':'U','घ':'¡','च':'R','ज':'H','त':'T','ध':'W','न':'G','प':'K','ब':'A','भ':'E','म':'D','ल':'N','व':'J','श':'Z','स':':','ह':'X','ण':'0','क्ष':'I'};
  var PT_VOWEL = {'अ':'c','आ':'cf','इ':'O','ई':'O{','उ':'p','ऊ':'pm','ऋ':'C','ए':'P','ऐ':'P]','ओ':'cf]','औ':'cf}','ॐ':'ç'};
  var PT_MATRA = {'ा':'f','ी':'L','ु':"'",'ू':'"','ृ':'[','े':']','ै':'}','ो':'f]','ौ':'f}','ं':'+','ँ':'F','ः':'M'};
  var PT_OTHER = {'।':'.','०':')','१':'!','२':'@','३':'#','४':'$','५':'%','६':'^','७':'&','८':'*','९':'('};
  function ptIsCons(ch){ return !!ch && ch >= 'क' && ch <= 'ह'; }
  function ptEsc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function toPreeti(str){
    var s = String(str == null ? '' : str).replace(/[\u200c\u200d\u093c]/g, '');
    var out = '', i = 0, n = s.length;
    var FB = ' style="font-family:\'Noto Serif Devanagari\',serif"'; // फन्टमा नभएका अक्षर (अङ्ग्रेजी आदि) का लागि
    function fb(t){ return '<span' + FB + '>' + ptEsc(t) + '</span>'; }
    while (i < n) {
      var c = s.charAt(i);
      if (ptIsCons(c)) {
        var units = [], reph = false, rakar = false, trailing = false;
        // रेफ (र्) — क्लस्टरको सुरुमा 'र' + '्' + व्यञ्जन
        if (c === 'र' && s.charAt(i + 1) === '्' && ptIsCons(s.charAt(i + 2))) { reph = true; i += 2; }
        for (;;) {
          var u = s.charAt(i); i++;
          if (u === 'क' && s.charAt(i) === '्' && s.charAt(i + 1) === 'ष') { u = 'क्ष'; i += 2; }
          else if (u === 'त' && s.charAt(i) === '्' && s.charAt(i + 1) === 'र') { u = 'त्र'; i += 2; }
          else if (u === 'ज' && s.charAt(i) === '्' && s.charAt(i + 1) === 'ञ') { u = 'ज्ञ'; i += 2; }
          units.push(u);
          if (s.charAt(i) === '्') {
            var nx = s.charAt(i + 1);
            if (nx === 'र' && s.charAt(i + 2) !== '्') { rakar = true; i += 2; break; }   // रकार (्र) — जस्तै प्र
            if (ptIsCons(nx)) { i++; continue; }                                            // संयुक्त अक्षर जारी
            trailing = true; i++; break;                                                    // शब्दको अन्त्यको हलन्त
          }
          break;
        }
        var matras = [];
        while (i < n && PT_MATRA[s.charAt(i)] || s.charAt(i) === 'ि') { matras.push(s.charAt(i)); i++; }
        var hasI = matras.indexOf('ि') >= 0;
        // रु / रू — Preeti मा छुट्टै अक्षर '?' हुन्छ (र + ु/ू को सट्टा)
        var ru = (units.length === 1 && units[0] === 'र' && !reph && !rakar && !trailing && (matras.indexOf('ु') >= 0 || matras.indexOf('ू') >= 0));
        if (hasI) out += 'l';                                  // ि व्यञ्जनभन्दा अगाडि लेखिन्छ
        if (ru) out += '?';
        for (var k = 0; !ru && k < units.length; k++) {
          var un = units[k], last = (k === units.length - 1);
          if (!last) out += PT_HALF[un] || (PT_FULL[un] + '\\');
          else if (trailing) out += PT_HALF[un] || (PT_FULL[un] + '\\');
          else out += PT_FULL[un] + (rakar ? '|' : '');
        }
        if (reph) out += '{';                                  // रेफ अन्तिम अक्षरको माथि
        matras.forEach(function(m){ if (m !== 'ि' && !(ru && (m === 'ु' || m === 'ू'))) out += PT_MATRA[m]; });
        continue;
      }
      if (PT_VOWEL[c]) { out += PT_VOWEL[c]; i++; continue; }
      if (c === 'ि') { out += 'l'; i++; continue; }
      if (PT_MATRA[c]) { out += PT_MATRA[c]; i++; continue; }
      if (PT_OTHER[c]) { out += PT_OTHER[c]; i++; continue; }
      if (/[A-Za-z0-9]/.test(c)) {                             // अङ्ग्रेजी/अंक — सामान्य फन्टमा
        var j = i; while (j < n && /[A-Za-z0-9]/.test(s.charAt(j))) j++;
        out += fb(s.slice(i, j)); i = j; continue;
      }
      if (c >= '\u0900' && c <= '\u097f') { out += fb(c); i++; continue; } // नमिलेको देवनागरी — fallback
      out += ptEsc(c); i++;
    }
    return out;
  }

  function loadNewsFeed(el, columnsClass){
    if (!el) return;
    var src = el.dataset.source;
    fetch(src, { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(items){
        if (!items || !items.length) {
          el.innerHTML = '<div class="news-feed-empty">हाल कुनै समाचार छैन।</div>';
          return;
        }
        el.innerHTML = items.map(function(item){
          var img = item.image ? '<img src="' + esc(item.image) + '" alt="' + esc(item.title) + '">' : '';
          var title = item.title ? '<h3 class="preeti-title" aria-label="' + esc(item.title) + '">' + toPreeti(item.title) + '</h3>' : '';
          var color = item.color ? 'color:' + esc(item.color) + ';' : '';
          return '<div class="news-feed-card">' + img +
                 '<div class="nf-body">' + title + '<div class="' + columnsClass + '" style="' + color + '">' + toParagraphHtml(item.text) + '</div></div></div>';
        }).join('');
      })
      .catch(function(){ el.innerHTML = '<div class="news-feed-empty">समाचार लोड गर्न सकिएन।</div>'; });
  }
  loadNewsFeed(document.getElementById('newsFeedList'), 'nf-columns');
  loadNewsFeed(document.getElementById('newsFeedList2'), 'nf-single');
})();
</script>

<!-- किताब (FLIP BOOK) — data/book.json बाट, book.html बाट सारिएको -->
<script>
(function () {
    var PAGE_TARGET_HEIGHT = 398;
    var container = document.getElementById('flipBookContainer');
    if (!container) return;

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    function toBlocks(raw) {
        return String(raw || '').split(/\n\s*\n/).map(function (b) {
            var t = b.trim();
            if (!t) return '';
            if (/^<img\b/i.test(t)) return t;
            return '<p>' + t.replace(/\n/g, '<br>') + '</p>';
        }).filter(Boolean);
    }

    function paginate(blocks) {
        var measure = document.createElement('div');
        measure.className = 'book-page-text book-front';
        measure.style.position = 'fixed';
        measure.style.left = '-9999px';
        measure.style.top = '0';
        measure.style.height = 'auto';
        measure.style.visibility = 'hidden';
        document.getElementById('bookEmbedWrap').appendChild(measure);

        var pages = [];
        var current = '';
        blocks.forEach(function (block) {
            var test = current + block;
            measure.innerHTML = test;
            if (current && measure.scrollHeight > PAGE_TARGET_HEIGHT) {
                pages.push(current);
                current = block;
            } else {
                current = test;
            }
        });
        if (current) pages.push(current);
        measure.remove();
        return pages;
    }

    function buildFlipBook(data, pages, colorStyle) {
        var title = data.title || '';
        var coverColor = data.coverColor || '#dc143c';
        var coverImage = data.coverImage || '';
        // मूल रिपोको edge-shading graphic सधैं देखिने गरी माथि तह लगाइन्छ; कभर फोटो (भए) त्यसमुनि।
        var coverStyle = "background-image:url('flipbook/images/flip_book_edge_shading.webp')" +
            (coverImage ? ", url('" + coverImage + "')" : "") + ';' +
            'background-size:cover' + (coverImage ? ',cover' : '') + ';' +
            'background-position:center' + (coverImage ? ',center' : '') + ';' +
            'background-repeat:no-repeat' + (coverImage ? ',no-repeat' : '') + ';' +
            'background-color:' + coverColor + ';';

        var totalSheets = Math.max(1, Math.ceil(pages.length / 2));
        var html = '<input type="checkbox" id="cover_checkbox">';
        for (var i = 1; i <= totalSheets; i++) html += '<input type="checkbox" id="page' + i + '_checkbox">';

        html += '<div id="flip_book">';
        html += '<div class="front_cover" style="' + coverStyle + '"><label for="cover_checkbox" id="cover"></label></div>';

        for (var i = 1; i <= totalSheets; i++) {
            var front = pages[(i - 1) * 2] || '';
            var back = pages[(i - 1) * 2 + 1] || '';
            html += '<div class="page" id="bookPage' + i + '">' +
                '<div class="front_page"><label for="page' + i + '_checkbox"></label>' +
                '<img class="edge_shading" src="flipbook/images/front_page_edge_shading.webp" alt="">' +
                '<div class="book-page-text book-front" style="' + colorStyle + '">' + front + '</div></div>' +
                '<div class="back_page"><label for="page' + i + '_checkbox"></label>' +
                '<img class="edge_shading" src="flipbook/images/back_page_edge_shading.webp" alt="">' +
                '<div class="book-page-text book-back" style="' + colorStyle + '">' + back + '</div></div>' +
                '</div>';
        }
        html += '<div class="back_cover"></div></div>';
        container.innerHTML = html;

        var rules = '';
        for (var i = 1; i <= totalSheets; i++) {
            rules += '#bookPage' + i + '{z-index:' + (totalSheets - i + 1) + ';}';
            rules += '#page' + i + '_checkbox:checked~#flip_book #bookPage' + i + '{transform:rotateY(-180deg);z-index:' + (totalSheets + i) + ';}';
        }
        var styleTag = document.createElement('style');
        styleTag.id = 'dynamicBookPageStyles';
        styleTag.textContent = rules;
        document.head.appendChild(styleTag);
    }

    function applyScale() {
        var host = document.getElementById('bookEmbedWrap');
        var wrap = document.getElementById('bookScaleWrap');
        var coverCheckbox = document.getElementById('cover_checkbox');
        if (!host || !wrap) return;
        var isOpen = !!(coverCheckbox && coverCheckbox.checked);
        // बन्द हुँदा (कभर मात्र) एउटा पानाको चौडाइमा जुम-इन गरेर मोबाइल स्क्रिनमा फिट;
        // खोल्दा (दुई पाना देखिने) दोब्बर चौडाइमा जुम-आउट गरेर दुवै पाना फिट हुने।
        var TARGET_W = isOpen ? 596 : 298;
        var availW = host.clientWidth - 16;
        var scale = availW / TARGET_W;
        if (!isOpen) scale = Math.min(scale, 1.6); // कभर अवस्थामा अत्यधिक ठूलो नहोस्
        wrap.style.transform = 'scale(' + scale + ')';
        host.style.height = Math.round(420 * scale) + 'px';
    }

    var withTimeout = function (p, ms) { return Promise.race([p, new Promise(function (r) { setTimeout(r, ms); })]); };
        // book.json तुरुन्तै तान्ने; फन्ट (यही टेक्स्टको अक्षर मात्र) र भित्री फोटो समानान्तर लोड गरेर
        // अधिकतम १.५ सेकेन्ड मात्र पर्खने — सबै फन्ट (document.fonts.ready) को लागि होइन।
        Promise.resolve(fetch('data/book.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }))
            .then(function (data) {
                var txt = String(data.text || '');
                var sample = txt.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').slice(0, 300) || 'अ';
                var fontP = (document.fonts && document.fonts.load)
                    ? document.fonts.load('400 9px Khand', sample).catch(function () {}) : Promise.resolve();
                var srcs = []; txt.replace(/<img[^>]+src="([^"]+)"/g, function (m, s) { srcs.push(s); return m; });
                var imgP = Promise.all(srcs.map(function (s) {
                    return new Promise(function (res) { var im = new Image(); im.onload = im.onerror = res; im.src = s; });
                }));
                return withTimeout(Promise.all([fontP, imgP]), 1500).then(function () { return data; });
            })
            .then(function (data) {
            var blocks = toBlocks(data.text);
            var pages = paginate(blocks);
            var colorStyle = data.color ? 'color:' + data.color + ';' : '';
            buildFlipBook(data, pages, colorStyle);
            applyScale();
            window.addEventListener('resize', applyScale);
            window.addEventListener('orientationchange', applyScale);
            var coverCheckbox = document.getElementById('cover_checkbox');
            if (coverCheckbox) coverCheckbox.addEventListener('change', applyScale);
        })
        .catch(function () {
            container.innerHTML = '<p style="color:#5c2f26;">किताब लोड गर्न सकिएन।</p>';
        });
})();
</script>

<!-- प्रतीक साहित्य संग्रह (pratikadhikari98.com.np) बाट लाइभ कविता: data/kavita/N.js + data/poems.json (एडमिनले थपेका/सम्पादित/लुकाइएका) -->
<script>
(function(){
  var ORIGIN = 'https://pratikadhikari98.com.np/';
  var SHOW = 4;
  var section = document.getElementById('poemFeedSection');
  var box = document.getElementById('poemFeed');
  var btn = document.getElementById('pfShuffle');
  if (!section || !box) return;
  var poems = [];

  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  function loadScript(src){
    return new Promise(function(res){
      var s=document.createElement('script'); s.src=src;
      s.onload=function(){ res(true); }; s.onerror=function(){ res(false); };
      document.head.appendChild(s);
    });
  }
  // प्रतीक साइटको index.html ले जुन kavita/N.js load गर्छ, त्यही सूची तान्ने (नयाँ फाइल थपिए पनि आफैं मिल्छ)
  function baseFileList(){
    var fallback=[]; for(var i=1;i<=16;i++) fallback.push(String(i));
    return fetch(ORIGIN, { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(html){
      var re=/data\/kavita\/(\d+)\.js/g, m, out=[];
      while((m=re.exec(html))){ if(out.indexOf(m[1])<0) out.push(m[1]); }
      return out.length ? out : fallback;
    }).catch(function(){ return fallback; });
  }
  function loadBase(){
    return baseFileList().then(function(list){
      var prev = window.KAVITA_DATA, had = Object.prototype.hasOwnProperty.call(window,'KAVITA_DATA');
      window.KAVITA_DATA = [];
      return Promise.all(list.map(function(n){ return loadScript(ORIGIN+'data/kavita/'+n+'.js'); })).then(function(){
        var base = window.KAVITA_DATA;
        if (had) window.KAVITA_DATA = prev; else { try { delete window.KAVITA_DATA; } catch(e){ window.KAVITA_DATA = undefined; } }
        return base;
      });
    });
  }
  function loadRemote(){
    return fetch(ORIGIN+'data/poems.json?t='+Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  }
  // प्रतीक साइटकै app.js को जस्तै merge: hidden हटाउने, overrides मिलाउने, नयाँ रचना थप्ने
  function merge(base, db){
    db = db || {};
    var hidden = {}; (db.hidden||[]).forEach(function(id){ hidden[id]=1; });
    var ov = db.overrides || {};
    var out = base.filter(function(p){ return !hidden[p.id]; }).map(function(p){ return ov[p.id] ? Object.assign({}, p, ov[p.id]) : p; });
    (db.poems||[]).forEach(function(p){ if(!hidden[p.id]) out.push(p); });
    var seen = {};
    return out.filter(function(p){
      if (!p || !p.id || seen[p.id]) return false; seen[p.id]=1;
      var cat = p.category || 'kavita';
      return (cat==='kavita' || cat==='gazal') && String(p.content||'').trim();
    });
  }
  function coverUrl(c){ c=String(c||'').trim(); if(!c) return ''; if(/^https?:\/\//i.test(c)) return c; return ORIGIN + c.replace(/^\/+/, ''); }
  function colorOf(p){ var c=String(p.coverColor||''); return /^(#[0-9a-f]{3,8}|rgb\([\d\s,]+\))$/i.test(c) ? c : ''; }
  function catLabel(c){ return c==='gazal' ? 'गजल' : 'कविता'; }
  function textCover(title){ return '<div class="pf-text-cover"><div class="pf-text-title">'+esc(String(title||'').trim())+'</div></div>'; }
  var shown = [];
  function card(p, i){
    var url = coverUrl(p.cover), col = colorOf(p);
    var face = url
      ? '<div class="pf-face"'+(col?' style="--cover-color:'+col+'"':'')+'><img src="'+esc(url)+'" alt="" loading="lazy"></div>'
      : '<div class="pf-face is-text"'+(col?' style="--cover-color:'+col+'"':'')+'>'+textCover(p.title)+'</div>';
    return '<div class="pf-item" role="button" tabindex="0" data-i="'+i+'" aria-label="'+esc(String(p.title||'').trim())+'">' +
      '<div class="pf-book">'+face+'</div>' +
      '<div class="pf-info"><div class="pf-cat">'+catLabel(p.category)+'</div>' +
      '<div class="pf-title">'+esc(String(p.title||'').trim())+'</div>' +
      (p.readTime ? '<div class="pf-rt">⏱ '+esc(String(p.readTime).trim())+'</div>' : '') + '</div></div>';
  }
  function render(){
    if (!poems.length) { section.style.display='none'; return; }
    shown = shuffle(poems).slice(0, SHOW);
    box.innerHTML = '<div class="pf-grid">' + shown.map(card).join('') + '</div>';
    section.style.display = '';
    Array.prototype.forEach.call(box.querySelectorAll('.pf-face > img'), function(img){
      img.addEventListener('error', function(){
        var face = img.parentNode, p = shown[+face.closest('.pf-item').dataset.i];
        face.classList.add('is-text'); face.innerHTML = textCover(p && p.title);
      });
    });
  }

  // कभरमा छोएपछि मात्र कविता खुल्छ
  var modal = document.createElement('div');
  modal.className = 'pf-modal'; modal.hidden = true;
  modal.innerHTML = '<div class="pf-panel" role="dialog" aria-modal="true">' +
    '<button type="button" class="pf-close" aria-label="बन्द गर्नुहोस्">✕</button>' +
    '<h3></h3><div class="pf-meta"></div><div class="pf-text"></div>' +
    '<div class="pf-foot"><a href="'+ORIGIN+'" target="_blank" rel="noopener">प्रतीक साहित्य संग्रहमा थप कविता पढ्नुहोस् →</a></div></div>';
  document.body.appendChild(modal);
  var panel = modal.querySelector('.pf-panel');
  function openPoem(p){
    var meta = [];
    if (p.readTime) meta.push(esc(String(p.readTime).trim()));
    (p.tags||[]).slice(0,4).forEach(function(t){ t=String(t).trim(); if(t) meta.push('#'+esc(t)); });
    modal.querySelector('h3').textContent = String(p.title||'').trim();
    modal.querySelector('.pf-meta').innerHTML = meta.join(' · ');
    modal.querySelector('.pf-text').textContent = String(p.content||'').trim();
    modal.hidden = false; panel.scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }
  function closePoem(){ modal.hidden = true; document.body.style.overflow = ''; }
  modal.addEventListener('click', function(e){ if (e.target === modal || e.target.closest('.pf-close')) closePoem(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !modal.hidden) closePoem(); });
  function tapItem(e){
    var c = e.target.closest('.pf-item'); if (!c) return;
    var p = shown[+c.dataset.i]; if (p) openPoem(p);
  }
  box.addEventListener('click', tapItem);
  box.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapItem(e); } });
  if (btn) btn.addEventListener('click', render);

  Promise.all([loadBase(), loadRemote()]).then(function(r){
    poems = merge(r[0] || [], r[1]);
    render();
  }).catch(function(){ section.style.display='none'; });
})();
</script>

<!-- AD CAROUSEL — data/ads.json बाट, auto-only crossfade (no manual swipe, no dots) -->
<script>
(function(){
  var wrap = document.getElementById('adCarousel');
  if (!wrap) return;
  var track = document.getElementById('adCarouselTrack');
  var src = wrap.dataset.source;

  fetch(src, { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(items){
      if (!items || !items.length) { wrap.style.display = 'none'; return; }
      track.innerHTML = items.map(function(item){
        return '<div class="ad-slide"><img src="' + item.image + '" alt="विज्ञापन"></div>';
      }).join('');
      var slides = track.children;
      if (slides.length) slides[0].classList.add('active');

      if (slides.length > 1) {
        var idx = 0;
        setInterval(function(){
          slides[idx].classList.remove('active');
          idx = (idx + 1) % slides.length;
          slides[idx].classList.add('active');
        }, 3500);
      }
    })
    .catch(function(){ wrap.style.display = 'none'; });
})();
</script>






<script>
// ── WHEEL CENTER ANALOGUE CLOCK ──
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const CX = 160, CY = 160, R = 48; // clock radius (inner ring)
  const tg = document.getElementById('clockTicks');

  // Draw tick marks & Nepali numerals
  const nums = ['१२','१','२','३','४','५','६','७','८','९','१०','११'];
  for (let i = 0; i < 60; i++) {
    const rad = i * 6 * Math.PI / 180;
    const isHour = i % 5 === 0, isQ = i % 15 === 0;
    const r1 = R, r2 = isQ ? R - 8 : isHour ? R - 6 : R - 3;
    const sw = isQ ? 2 : isHour ? 1.4 : 0.7;
    const op = isQ ? '0.7' : isHour ? '0.5' : '0.2';
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', CX + r1 * Math.sin(rad));
    line.setAttribute('y1', CY - r1 * Math.cos(rad));
    line.setAttribute('x2', CX + r2 * Math.sin(rad));
    line.setAttribute('y2', CY - r2 * Math.cos(rad));
    line.setAttribute('stroke', '#5c2f26');
    line.setAttribute('stroke-width', sw);
    line.setAttribute('opacity', op);
    line.setAttribute('stroke-linecap', 'round');
    tg.appendChild(line);
  }
  for (let i = 0; i < 12; i++) {
    const rad = i * 30 * Math.PI / 180;
    const isQ = i % 3 === 0;
    const nr = isQ ? R - 14 : R - 13;
    const txt = document.createElementNS(NS, 'text');
    txt.setAttribute('x', CX + nr * Math.sin(rad));
    txt.setAttribute('y', CY - nr * Math.cos(rad));
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('dominant-baseline', 'central');
    txt.setAttribute('font-size', isQ ? '7' : '6');
    txt.setAttribute('font-weight', isQ ? '700' : '600');
    txt.setAttribute('fill', '#5c2f26');
    txt.setAttribute('opacity', isQ ? '0.75' : '0.5');
    txt.setAttribute('font-family', 'Noto Sans Devanagari, sans-serif');
    txt.textContent = nums[i];
    tg.appendChild(txt);
  }

  function rot(id, deg) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('transform', `rotate(${deg},${CX},${CY})`);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const h24 = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    const h12 = h24 % 12 || 12;
    const ampm = h24 < 12 ? 'AM' : 'PM';
    rot('wHourHand',   (h24 % 12) * 30 + m * 0.5);
    rot('wMinuteHand', m * 6  + s * 0.1);
    rot('wSecondHand', s * 6);
    const el = document.getElementById('wheelDigitalTime');
    const NP = n => String(n).replace(/[0-9]/g, d => '०१२३४५६७८९'[+d]);
    const ampmNP = h24 < 12 ? 'बिहान' : h24 < 17 ? 'दिउँसो' : 'बेलुकी';
    if (el) el.textContent = NP(pad(h12)) + ':' + NP(pad(m)) + ':' + NP(pad(s)) + ' ' + ampmNP;
  }

  tick();
  setInterval(tick, 1000);
})();
</script>

<script>
(function () {
  const wrap  = document.getElementById('wheelWrap');
  const group = document.getElementById('wheelGroup');
  const CX = 160, CY = 160;
  const VB_SIZE = 320; // viewBox logical size (before the -5 offset)

  const AUTO_SPEED = 1.20;   // deg/frame — छिटो spin
  const FRICTION   = 0.97;
  const MIN_VEL    = 0.05;

  let angle    = 0;
  let velocity = AUTO_SPEED; // start with auto-spin speed
  let dragging = false;
  let prevMouseAngle = 0;
  let lastTime = 0;
  let rafId    = null;

  /* Convert client coords → angle (deg) from wheel center */
  function clientToAngle(e) {
    const rect = wrap.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    // Map to viewBox coords (viewBox is "-5 -5 330 330", so offset by 5)
    const svgX = ((cx - rect.left) / rect.width)  * 330 - 5;
    const svgY = ((cy - rect.top)  / rect.height) * 330 - 5;
    return Math.atan2(svgY - CY, svgX - CX) * (180 / Math.PI);
  }

  function applyRotation() {
    group.setAttribute('transform', `rotate(${angle},${CX},${CY})`);
  }

  /* Main animation loop — always running */
  function loop() {
    if (!dragging) {
      if (Math.abs(velocity) < MIN_VEL) {
        // Smoothly restore auto-spin direction
        velocity += (AUTO_SPEED - velocity) * 0.05;
      } else {
        velocity *= FRICTION;
        // Once slow enough, nudge back toward auto
        if (Math.abs(velocity) < AUTO_SPEED * 2) {
          velocity += (AUTO_SPEED - velocity) * 0.02;
        }
      }
      angle += velocity;
      applyRotation();
    }
    rafId = requestAnimationFrame(loop);
  }

  /* Drag start */
  function onStart(e) {
    e.preventDefault();
    dragging = true;
    velocity = 0;
    prevMouseAngle = clientToAngle(e);
    lastTime = performance.now();
  }

  /* Drag move */
  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const now = performance.now();
    const dt  = Math.max(now - lastTime, 1);
    const cur = clientToAngle(e);
    let delta = cur - prevMouseAngle;
    if (delta >  180) delta -= 360;
    if (delta < -180) delta += 360;

    velocity = delta / dt * 16; // scale to per-frame
    angle   += delta;
    applyRotation();
    prevMouseAngle = cur;
    lastTime = now;
  }

  /* Drag end — let inertia + loop take over */
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    // clamp velocity so it doesn't spin wildly
    velocity = Math.max(-8, Math.min(8, velocity));
  }

  // Mouse
  wrap.addEventListener('mousedown',  onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onEnd);
  // Touch
  wrap.addEventListener('touchstart', onStart, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend',  onEnd);

  // Kick off loop
  loop();
})();
</script>

<!-- SHOWCASE SLIDER — loads slides from data/showcase.json, auto + manual swipe -->
<script>
(function(){
  function escapeHtml(s){ var d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

  function initSlider(slider, items){
    var track = slider.querySelector('.showcase-slides');
    if (!track || !items || !items.length) return;

    track.innerHTML = items.map(function(item){
      return '<div class="showcase-top showcase-slide">' +
               '<div class="showcase-text"><p>' + escapeHtml(item.text) + '</p></div>' +
               '<div class="showcase-photo"><img src="' + escapeHtml(item.image) + '" alt="प्रतीक अध्यात्म सञ्जाल"></div>' +
             '</div>';
    }).join('');

    var n = track.children.length;
    // अनन्त loop: [अन्तिमको प्रति] + असली स्लाइडहरू + [पहिलोको प्रति]
    if (n > 1) {
      track.insertBefore(track.children[n - 1].cloneNode(true), track.firstChild);
      track.appendChild(track.children[1].cloneNode(true));
    }
    var slides = track.children;
    if (slides.length) slides[n > 1 ? 1 : 0].classList.add('active');
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          entry.target.classList.toggle('active', entry.intersectionRatio > 0.6);
        });
      }, { root: track, threshold: [0, 0.6, 1] });
      for (var s = 0; s < slides.length; s++) io.observe(slides[s]);
    }
    if (n < 2) return;

    function jump(left){
      track.style.scrollBehavior = 'auto';
      track.scrollLeft = left;
      track.style.scrollBehavior = '';
    }
    jump(track.clientWidth); // पहिलो असली स्लाइडबाट सुरु

    function currentIndex(){ return Math.round(track.scrollLeft / track.clientWidth); }
    // स्क्रोल रोकिएपछि प्रतिमा पुगेको भए बिना झट्का असली स्लाइडमा सार्ने (देखिने दृश्य उही रहन्छ)
    var settleTimer = null;
    function fixLoop(){
      var w = track.clientWidth; if (!w) return;
      var x = track.scrollLeft;
      if (x <= w * 0.5) jump(x + n * w);
      else if (x >= w * (n + 0.5)) jump(x - n * w);
    }
    track.addEventListener('scroll', function(){
      clearTimeout(settleTimer);
      settleTimer = setTimeout(fixLoop, 90);
    }, { passive: true });

    var lastW = track.clientWidth;
    window.addEventListener('resize', function(){
      var w = track.clientWidth;
      if (w && lastW) jump(track.scrollLeft * (w / lastW));
      lastW = w;
    });

    // auto — सधैं अगाडि, अन्तिमपछि पहिलो (loop)
    var autoTimer = null, touching = false;
    function nextSlide(){
      if (touching) return;
      track.scrollTo({ left: track.clientWidth * (currentIndex() + 1), behavior: 'smooth' });
    }
    function stopAuto(){ if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
    function startAuto(){ stopAuto(); autoTimer = setInterval(nextSlide, 4500); }
    function release(){ touching = false; setTimeout(function(){ if (!touching) startAuto(); }, 1800); }
    startAuto();
    track.addEventListener('pointerdown', function(){ touching = true; stopAuto(); });
    ['pointerup', 'pointercancel', 'touchend', 'touchcancel', 'mouseleave'].forEach(function(ev){
      track.addEventListener(ev, release, { passive: true });
    });
  }

  document.querySelectorAll('.showcase-slider').forEach(function(slider){
    var src = slider.dataset.source;
    if (!src) return;
    fetch(src, { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(items){ initSlider(slider, items); })
      .catch(function(){ /* JSON load गर्न सकिएन */ });
  });
})();
</script>

<!-- SHLOKA ROTATOR — data/shlokas.json बाट हरेक 5 सेकेन्डमा अर्को श्लोक -->
<script>
(function(){
  var rotator = document.getElementById('shlokaRotator');
  if (!rotator) return;
  var src = rotator.dataset.source;
  var textEl = document.getElementById('shlokaText');
  var meaningEl = document.getElementById('shlokaMeaning');

  fetch(src, { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(items){
      if (!items || !items.length) return;
      var idx = 0;
      function render(i){
        textEl.innerHTML = String(items[i].shloka || '').split('\n').map(function(line){
          var d = document.createElement('div'); d.textContent = line; return d.innerHTML;
        }).join('<br>');
        meaningEl.textContent = items[i].meaning || '';
      }
      render(0);
      if (items.length > 1) {
        setInterval(function(){
          rotator.classList.add('fading');
          setTimeout(function(){
            idx = (idx + 1) % items.length;
            render(idx);
            rotator.classList.remove('fading');
          }, 350);
        }, 5000);
      }
    })
    .catch(function(){ /* लोड गर्न सकिएन */ });
})();
</script>

<script>
// एक्सेसिबिलिटी आइकन एनिमेसन (accessibility.zip को motion component बाट रूपान्तरित)
(function(){
  var box = document.getElementById('adityaAccessIcon');
  if (!box || !box.animate) return;
  var circle = box.querySelector('.ac-circle'), prim = box.querySelector('.ac-primary'),
      path = box.querySelector('.ac-path'), sec = box.querySelector('.ac-secondary');
  var running = false;
  function play() {
    if (running) return; running = true;
    var o = {easing:'ease-in-out', fill:'none'};
    circle.animate([{transform:'translate(0,0)'},{transform:'translate(1px,1px)'},{transform:'translate(-1px,-1px)'},{transform:'translate(0,0)'}], Object.assign({duration:800}, o));
    prim.animate([{transform:'rotate(0deg)'},{transform:'rotate(5deg)'},{transform:'rotate(-5deg)'},{transform:'rotate(0deg)'}], Object.assign({duration:800}, o));
    path.animate([{transform:'rotate(0deg)'},{transform:'rotate(-60deg)'},{transform:'rotate(0deg)'}], Object.assign({duration:400, delay:200}, o));
    var last = sec.animate([{transform:'rotate(0deg)'},{transform:'rotate(-360deg)'}], Object.assign({duration:1000, delay:400}, o));
    last.onfinish = function(){ running = false; };
  }
  box.addEventListener('mouseenter', play);
  box.addEventListener('click', play);
  box.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') play(); });
  setTimeout(play, 600);
})();
</script>
